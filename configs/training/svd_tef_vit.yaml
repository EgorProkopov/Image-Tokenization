seed: 239

training:
  train_batch_size: 64
  val_batch_size: 64
  num_workers: 12
  
  accelerator: "gpu"
  devices: [0]
  strategy: "auto"

  backend: "torch"   
  # backend option supports only "torch" and "triton"

  max_epochs: 2
  lr: 5e-5
  warmup_steps: 2000
  lr_gamma: 0.90

  auxiliary_criterion: "gated_l1_loss"
  auxiliary_alpha: 1

logging:
  log_every_n_steps: 100
  val_check_interval: 500
  checkpoints_dir: "checkpoints"
  log_dir: "logs"
  

clearml:
  project_name: "tokenizers"
  task_name: "svd_tef_tokenizer_imagenet_full"
